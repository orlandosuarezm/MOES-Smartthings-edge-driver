name: moes-thermostat
components:
  - id: main
    capabilities:
      - id: temperatureMeasurement
        version: 1
      - id: thermostatHeatingSetpoint
        version: 1
      - id: switch
        version: 1
      - id: moneymedia27295.ecoMode
        version: 1
      - id: moneymedia27295.childLock
        version: 1
preferences:
  - name: "deviceIp"
    title: "IP del termostato"
    description: "Dirección IP local del BHT-002 en tu red"
    required: true
    preferenceType: string
    definition:
      stringType: text
      minLength: 7
      maxLength: 15
      default: "192.168.1.137"
  - name: "devicePort"
    title: "Puerto"
    description: "Puerto TCP del termostato (normalmente 6668)"
    required: false
    preferenceType: integer
    definition:
      minimum: 1
      maximum: 65535
      default: 6668
  - name: "deviceId"
    title: "Device ID (Tuya)"
    description: "ID del dispositivo obtenido de Tuya IoT Platform"
    required: true
    preferenceType: string
    definition:
      stringType: text
      minLength: 1
      maxLength: 64
      default: "eba40c3bb8205604f1mzip"
  - name: "localKey"
    title: "Local Key (Tuya)"
    description: "Clave local AES de 16 bytes obtenida de Tuya IoT Platform"
    required: true
    preferenceType: string
    definition:
      stringType: text
      minLength: 16
      maxLength: 44
      default: "Q;SGIxCix&WFwJGy"

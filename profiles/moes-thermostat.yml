name: moes-thermostat
components:
  - id: main
    capabilities:
      - id: temperatureMeasurement
        version: 1
      - id: thermostatHeatingSetpoint
        version: 1
      - id: switch
        version: 1
      # Cuando crees la custom capability ecoMode y actives ENABLE_CUSTOM_CAPS en
      # init.lua, descomenta esta línea con tu namespace real:
      # - id: REPLACE_NAMESPACE.ecoMode
      #   version: 1
preferences:
  - name: "deviceIp"
    title: "IP del termostato"
    description: "Dirección IP local del BHT-002 en tu red"
    required: true
    preferenceType: string
    definition:
      stringType: text
      minLength: 7
      maxLength: 15
      default: "192.168.1.136"
  - name: "devicePort"
    title: "Puerto"
    description: "Puerto TCP del termostato (normalmente 6668)"
    required: false
    preferenceType: integer
    definition:
      minimum: 1
      maximum: 65535
      default: 6668
  - name: "deviceId"
    title: "Device ID (Tuya)"
    description: "ID del dispositivo obtenido de Tuya IoT Platform"
    required: true
    preferenceType: string
    definition:
      stringType: text
      minLength: 1
      maxLength: 64
      default: "changeme"
  - name: "localKey"
    title: "Local Key (Tuya)"
    description: "Clave local AES de 16 bytes obtenida de Tuya IoT Platform"
    required: true
    preferenceType: string
    definition:
      stringType: text
      minLength: 16
      maxLength: 44
      default: "0000000000000000"
